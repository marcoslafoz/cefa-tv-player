<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CEFA TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body>
    <div id="stage">
      <div class="layer" id="layer-a"></div>
      <div class="layer" id="layer-b"></div>
    </div>
    <div id="screen" class="visible" data-screen="LOGO">
      <div id="logo-box"><img id="logo" src="/brand/cefa-logo-white.svg" alt="CEFA" /></div>
      <div id="pairing" class="block">
        <div id="pairing-title">Introduce este código en CEFA TV Server</div>
        <div id="pairing-code">------</div>
        <div id="pairing-server"></div>
      </div>
      <div id="status" class="block">
        <div id="status-title"></div>
        <div id="status-detail"></div>
        <div id="status-retry"></div>
      </div>
    </div>
    <script src="/player.js"></script>
  </body>
</html>
