services:
  player:
    image: ${CEFA_TV_IMAGE:-cefa-tv-player:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLAYER_BUILD: ${PLAYER_BUILD:-unknown}
    container_name: cefa-tv-player
    restart: unless-stopped
    init: true
    network_mode: host
    shm_size: 1gb
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - CEFA_TV_DATA_DIR=/data
      - DISPLAY_MODE=${DISPLAY_MODE:-headless}
    volumes:
      - cefa-tv-player-data:/data

volumes:
  cefa-tv-player-data:
    name: cefa-tv-player-data
